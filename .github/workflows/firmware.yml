name: Firmware (Tempolight Lite)
# Host tests of the Lite core, then WLED + AudioReactive + the Tempolight usermod built with PlatformIO for a classic
# ESP32 (esp32dev). On a tag (v*, firmware-v*) the images are attached to the GitHub release. This workflow doesn't
# deploy to GitHub Pages: when it finishes on a tag, the Docs workflow (docs.yml) rebuilds the site and publishes the
# web installer (docs/flash) at /flash/ with this release's image, so the two never fight over Pages.
on:
  push:
    branches: [main]
    tags: ["v*", "firmware-v*"]
  pull_request:
    paths: ["firmware/**", "docs/flash/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

env:
  WLED_REF: v16.0.1  # the WLED release the usermod is built against
  PIO_ENV: esp32dev_tempolight

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: wled/WLED
          ref: ${{ env.WLED_REF }}
          path: wled
      - name: Core tests + usermod smoke test (g++)
        run: WLED_DIR=wled firmware/test/run.sh
      - name: Core tests (clang++)
        run: CXX=clang++ firmware/test/run.sh

  build:
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: wled/WLED
          ref: ${{ env.WLED_REF }}
          path: wled
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.WLED_REF }}-${{ hashFiles('wled/platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1.16" "esptool==4.8.1"
      - name: Add the usermod to WLED
        run: firmware/scripts/add-to-wled.sh wled "$PIO_ENV"
      - name: Build WLED + AudioReactive + Tempolight Lite
        working-directory: wled
        run: |
          npm ci
          pio run -e "$PIO_ENV"
      - name: Images (factory image for the web installer, app image for WLED's own update page)
        run: |
          set -euo pipefail
          b="wled/.pio/build/$PIO_ENV"
          boot_app0="$(find ~/.platformio/packages -name boot_app0.bin | head -1)"
          mkdir -p out
          esptool.py --chip esp32 merge_bin -o out/tempolight-lite-esp32.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$b/bootloader.bin" 0x8000 "$b/partitions.bin" 0xe000 "$boot_app0" 0x10000 "$b/firmware.bin"
          cp "$b/firmware.bin" out/tempolight-lite-esp32-update.bin
          ls -l out
          # the usermod must really be in the image (its effect names are in flash as strings)
          grep -q "TL Kick Shockwave" "$b/firmware.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: tempolight-lite-esp32
          path: out/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tempolight-lite-esp32
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin

