name: Firmware (Tempolight Lite)
# Host tests of the Lite core, then WLED + AudioReactive + the Tempolight usermod built with PlatformIO for a classic
# ESP32 (esp32dev). On a tag (v*, firmware-v*) the images are attached to the GitHub release and the web installer
# (docs/flash) is published to GitHub Pages together with the image (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    tags: ["v*", "firmware-v*"]
  pull_request:
    paths: ["firmware/**", "docs/flash/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

env:
  WLED_REF: v16.0.1  # the WLED release the usermod is built against
  PIO_ENV: esp32dev_tempolight

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: wled/WLED
          ref: ${{ env.WLED_REF }}
          path: wled
      - name: Core tests + usermod smoke test (g++)
        run: WLED_DIR=wled firmware/test/run.sh
      - name: Core tests (clang++)
        run: CXX=clang++ firmware/test/run.sh

  build:
    runs-on: ubuntu-latest
    needs: host-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: wled/WLED
          ref: ${{ env.WLED_REF }}
          path: wled
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ env.WLED_REF }}-${{ hashFiles('wled/platformio.ini') }}
      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1.16" "esptool==4.8.1"
      - name: Add the usermod to WLED
        run: firmware/scripts/add-to-wled.sh wled "$PIO_ENV"
      - name: Build WLED + AudioReactive + Tempolight Lite
        working-directory: wled
        run: |
          npm ci
          pio run -e "$PIO_ENV"
      - name: Images (factory image for the web installer, app image for WLED's own update page)
        run: |
          set -euo pipefail
          b="wled/.pio/build/$PIO_ENV"
          boot_app0="$(find ~/.platformio/packages -name boot_app0.bin | head -1)"
          mkdir -p out
          esptool.py --chip esp32 merge_bin -o out/tempolight-lite-esp32.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$b/bootloader.bin" 0x8000 "$b/partitions.bin" 0xe000 "$boot_app0" 0x10000 "$b/firmware.bin"
          cp "$b/firmware.bin" out/tempolight-lite-esp32-update.bin
          ls -l out
          # the usermod must really be in the image (its effect names are in flash as strings)
          grep -q "TL Kick Shockwave" "$b/firmware.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: tempolight-lite-esp32
          path: out/*.bin

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tempolight-lite-esp32
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.bin

  installer:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true  # needs GitHub Pages set to "GitHub Actions"; the release above doesn't depend on it
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tempolight-lite-esp32
          path: out
      - name: Installer page + image, served together (the installer fetches the image from its own site)
        run: |
          mkdir -p site/flash site/images
          cp docs/flash/index.html docs/flash/manifest.json site/flash/
          cp docs/images/logo.svg site/images/
          cp out/tempolight-lite-esp32.bin site/flash/
          ver="${GITHUB_REF_NAME#firmware-}"; ver="${ver#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$ver\"/" site/flash/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
