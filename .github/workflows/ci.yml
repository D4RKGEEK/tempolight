name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          CI: "true"
      - name: Dry-run every effect for 2 seconds
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: timeout 2 node scripts/demo.js --dry --leds 600 --effect laser || [ $? -eq 124 ]
