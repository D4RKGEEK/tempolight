name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          CI: "true"
      - name: Server starts and answers
        shell: bash
        run: |
          node packages/server/src/index.js --port 18080 --data "$RUNNER_TEMP/tl" --no-discover &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:18080/api/health && break; sleep 0.5; done
          curl -fs http://127.0.0.1:18080/ | grep -q Tempolight

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) node scripts/e2e-browser.js
      - name: Online demo (as Cloudflare serves it)
        run: node scripts/build-site.js && NODE_PATH=$(npm root -g) node scripts/e2e-demo.js
      - name: Docs website (tempolight.pages.dev/docs)
        run: NODE_PATH=$(npm root -g) node scripts/e2e-docs.js

  docs:
    # links, anchors and images in README.md and docs/ (fast; the Docs workflow also compiles the Mermaid diagrams),
    # and the Mintlify site in mintlify/ is up to date with docs/ (node scripts/build-mintlify.js rewrites it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-docs.js --no-mermaid
      - run: node scripts/build-mintlify.js --check
