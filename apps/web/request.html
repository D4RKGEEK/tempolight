<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f4ee" media="(prefers-color-scheme: light)">
<title>Request a song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<style>
  /* tokens from design/tokens.md */
  :root { color-scheme: dark; --bg: #0f0d0b; --bg-deep: #0a0807; --surface: #17140f; --surface-2: #1e1a14; --sunk: #0b0a08;
    --text: #f4efe8; --text-2: rgb(244 239 232 / .64); --text-3: rgb(244 239 232 / .42);
    --hair: rgb(255 255 255 / .07); --ring: 0 0 0 1px rgb(255 255 255 / .06);
    --accent: #ff8a1f; --accent-ink: #1a0e08; --label: #ffb366; --focus: #ffb366; --ok: #3ecf7a; --bad: #ff5c5c;
    --shadow-card: var(--ring), 0 1px 2px rgb(0 0 0 / .3), 0 18px 40px -28px rgb(0 0 0 / .8);
    --shadow-lift: 0 0 0 1px rgb(255 255 255 / .1), 0 1px 2px rgb(0 0 0 / .3), 0 24px 44px -26px rgb(0 0 0 / .9);
    --sans: "Google Sans Flex", -apple-system, "Segoe UI", system-ui, sans-serif; --mono: "Google Sans Code", ui-monospace, Menlo, monospace;
    --r-btn: 11px; --r-field: 11px; --r-card: 24px; --r-inner: 18px; --r-pill: 999px; --ease: cubic-bezier(.2,.8,.2,1); --t-in: .14s; --t-out: .2s; }
  @media (prefers-color-scheme: light) { :root { color-scheme: light; --bg: #f8f4ee; --bg-deep: #140a05; --surface: #ffffff; --surface-2: #fffaf6; --sunk: #f3eee7;
    --text: #1a0e08; --text-2: rgb(26 14 8 / .62); --text-3: rgb(26 14 8 / .42);
    --hair: rgb(20 10 5 / .06); --ring: 0 0 0 1px rgb(20 10 5 / .05);
    --accent: #ff5b14; --accent-ink: #ffffff; --label: #c2410c; --focus: #c2410c; --ok: #1f6b37; --bad: #c0262d;
    --shadow-card: var(--ring), 0 1px 2px rgb(20 10 5 / .04), 0 18px 40px -28px rgb(80 30 5 / .25);
    --shadow-lift: 0 0 0 1px rgb(20 10 5 / .08), 0 1px 2px rgb(20 10 5 / .05), 0 24px 44px -26px rgb(80 30 5 / .34); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
  main { max-width: 560px; margin: 0 auto; padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; color: var(--text-2); margin-bottom: 28px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgb(255 138 31 / .16), 0 0 14px var(--accent); }
  h1 { font-size: 40px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.04em; line-height: 1.04; }
  p.lead { margin: 0 0 24px; color: var(--text-2); font-size: 17px; }
  form { display: grid; gap: 16px; background: var(--surface); box-shadow: var(--shadow-card); border-radius: var(--r-card); padding: 20px; }
  label { display: block; font-size: 14px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; }
  input { width: 100%; font: inherit; color: var(--text); background: var(--sunk); border: 0; box-shadow: var(--ring); border-radius: var(--r-field); padding: 0 14px; min-height: 48px; }
  input::placeholder { color: var(--text-3); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: 500 15px var(--sans); letter-spacing: -.01em; border: 0; border-radius: var(--r-btn); min-height: 48px; padding: 0 20px; cursor: pointer; transition: transform var(--t-out) var(--ease), box-shadow var(--t-out) var(--ease), filter var(--t-out) var(--ease); }
  button:hover:not(:disabled) { transform: translateY(-1px); transition-duration: var(--t-in); }
  button:active:not(:disabled) { transform: translateY(1px) scale(.985); transition-duration: .09s; }
  .go { color: var(--accent-ink); background: var(--accent); box-shadow: 0 1px 2px rgb(0 0 0 / .2), 0 12px 28px -14px var(--accent); }
  .go:hover:not(:disabled) { filter: brightness(1.05); }
  .go:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 17px; margin: 40px 0 12px; font-weight: 600; letter-spacing: -.015em; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--hair); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow-card); }
  li { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 14px 14px 14px 20px; }
  li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  li .by { display: block; font-size: 13px; font-weight: 400; color: var(--text-2); }
  .vote { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); min-height: 40px; padding: 0 14px; min-width: 68px; font: 500 14px var(--mono); font-variant-numeric: tabular-nums; }
  .vote:hover:not(:disabled) { box-shadow: var(--shadow-lift); }
  .vote[aria-pressed="true"] { background: var(--sunk); color: var(--label); box-shadow: inset 0 0 0 1px var(--label); }
  #msg { min-height: 1.4em; font-size: 14px; color: var(--text-2); margin: -4px 0 0; }
  #msg:empty { display: none; }
  .empty { color: var(--text-2); font-size: 15px; padding: 20px; }
</style>
</head>
<body>
<main>
  <div class="brand"><i aria-hidden="true"></i>Tempolight</div>
  <h1>Request a song</h1>
  <p class="lead">Tell the host what to play next. Songs with more votes go to the top.</p>
  <form id="f" autocomplete="off">
    <div><label for="title">Song</label><input id="title" name="title" maxlength="120" placeholder="Artist and song" required></div>
    <div><label for="by">Your name (optional)</label><input id="by" name="by" maxlength="40" placeholder="So the host can shout you out"></div>
    <button class="go" id="send" type="submit">Send request</button>
    <div id="msg" role="status"></div>
  </form>
  <h2>Up next</h2>
  <ol id="list"><li class="empty">Loading…</li></ol>
</main>
<script type="module">
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const demo = !!document.querySelector('meta[name="tempolight-demo"]');
let voted = new Set(); try { voted = new Set(JSON.parse(localStorage.getItem("tl.voted") || "[]")); } catch {}
const saveVotes = () => { try { localStorage.setItem("tl.voted", JSON.stringify([...voted])); } catch {} };
try { $("#by").value = localStorage.getItem("tl.name") || ""; } catch {}
async function call(method, path, body) { const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || `Error ${r.status}`); return j; }
async function load() {
  if (demo) { $("#list").innerHTML = '<li class="empty">Requests go to a Tempolight running at home or at the party. This online demo has none.</li>'; $("#send").disabled = true; return; }
  try { const r = await call("GET", "/api/requests");
    if (!r.enabled) { $("#send").disabled = true; $("#msg").textContent = "The host has turned song requests off."; }
    $("#list").innerHTML = r.requests.length ? r.requests.map(q => `<li><span class="t">${esc(q.title)}${q.by ? `<span class="by">from ${esc(q.by)}</span>` : ""}</span><button class="vote" type="button" data-id="${q.id}" aria-pressed="${voted.has(q.id)}" aria-label="Vote for ${esc(q.title)}">▲ ${q.votes}</button></li>`).join("")
      : '<li class="empty">No requests yet. Send the first one.</li>';
    document.querySelectorAll(".vote").forEach(b => b.onclick = async () => { if (voted.has(b.dataset.id)) return; try { await call("POST", `/api/requests/${b.dataset.id}/vote`); voted.add(b.dataset.id); saveVotes(); load(); } catch (e) { $("#msg").textContent = e.message; } });
  } catch (e) { $("#list").innerHTML = `<li class="empty">Can't reach Tempolight right now (${esc(e.message)}).</li>`; }
}
$("#f").onsubmit = async e => { e.preventDefault(); const title = $("#title").value.trim(), by = $("#by").value.trim(); if (!title) return;
  $("#send").disabled = true; try { localStorage.setItem("tl.name", by); } catch {}
  try { const r = await call("POST", "/api/requests", { title, by }); voted.add(r.id); saveVotes(); $("#title").value = ""; $("#msg").textContent = r.merged ? "Someone asked for that already: your vote was added." : "Sent. The host sees it now."; load(); }
  catch (err) { $("#msg").textContent = err.message; } finally { $("#send").disabled = false; } };
load(); setInterval(load, 10000);
</script>
</body>
</html>
