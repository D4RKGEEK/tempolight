<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12081f">
<title>Request a song</title>
<style>
  :root { color-scheme: dark; --bg: #12081f; --card: #1d1030; --line: #34234d; --text: #f4eefc; --muted: #b9aecb; --acc: #ff8a4c; --acc2: #ff5fa2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; margin: 8px 0 4px; letter-spacing: -.01em; }
  p.lead { margin: 0 0 18px; color: var(--muted); }
  form { display: grid; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  label { font-size: 13px; color: var(--muted); }
  input { width: 100%; font: inherit; color: var(--text); background: #0d0618; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  button { font: inherit; font-weight: 650; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
  .go { color: #1b0a12; background: linear-gradient(135deg, var(--acc), var(--acc2)); }
  .go:disabled { opacity: .6; }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .by { display: block; font-size: 12.5px; color: var(--muted); }
  .vote { background: #2a1840; color: var(--text); padding: 8px 12px; min-width: 64px; }
  .vote[aria-pressed="true"] { background: #3b2160; color: var(--acc); }
  #msg { min-height: 1.4em; font-size: 14px; color: var(--acc); margin: 4px 0 0; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Request a song</h1>
  <p class="lead">Tell the host what to play next. Songs with more votes go to the top.</p>
  <form id="f" autocomplete="off">
    <div><label for="title">Song</label><input id="title" name="title" maxlength="120" placeholder="Artist – Song" required></div>
    <div><label for="by">Your name (optional)</label><input id="by" name="by" maxlength="40" placeholder="So the host can shout you out"></div>
    <button class="go" id="send" type="submit">Send request</button>
    <div id="msg" role="status"></div>
  </form>
  <h2>Up next</h2>
  <ol id="list"><li class="empty">Loading…</li></ol>
</main>
<script type="module">
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const demo = !!document.querySelector('meta[name="tempolight-demo"]');
let voted = new Set(); try { voted = new Set(JSON.parse(localStorage.getItem("tl.voted") || "[]")); } catch {}
const saveVotes = () => { try { localStorage.setItem("tl.voted", JSON.stringify([...voted])); } catch {} };
try { $("#by").value = localStorage.getItem("tl.name") || ""; } catch {}
async function call(method, path, body) { const r = await fetch(path, { method, headers: { "content-type": "application/json" }, body: body && JSON.stringify(body) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || `Error ${r.status}`); return j; }
async function load() {
  if (demo) { $("#list").innerHTML = '<li class="empty">Requests go to a Tempolight running at home or at the party. This online demo has none.</li>'; $("#send").disabled = true; return; }
  try { const r = await call("GET", "/api/requests");
    if (!r.enabled) { $("#send").disabled = true; $("#msg").textContent = "The host has turned song requests off."; }
    $("#list").innerHTML = r.requests.length ? r.requests.map(q => `<li><span class="t">${esc(q.title)}${q.by ? `<span class="by">from ${esc(q.by)}</span>` : ""}</span><button class="vote" type="button" data-id="${q.id}" aria-pressed="${voted.has(q.id)}" aria-label="Vote for ${esc(q.title)}">▲ ${q.votes}</button></li>`).join("")
      : '<li class="empty">No requests yet. Be the first!</li>';
    document.querySelectorAll(".vote").forEach(b => b.onclick = async () => { if (voted.has(b.dataset.id)) return; try { await call("POST", `/api/requests/${b.dataset.id}/vote`); voted.add(b.dataset.id); saveVotes(); load(); } catch (e) { $("#msg").textContent = e.message; } });
  } catch (e) { $("#list").innerHTML = `<li class="empty">Can't reach Tempolight right now (${esc(e.message)}).</li>`; }
}
$("#f").onsubmit = async e => { e.preventDefault(); const title = $("#title").value.trim(), by = $("#by").value.trim(); if (!title) return;
  $("#send").disabled = true; try { localStorage.setItem("tl.name", by); } catch {}
  try { const r = await call("POST", "/api/requests", { title, by }); voted.add(r.id); saveVotes(); $("#title").value = ""; $("#msg").textContent = r.merged ? "Someone asked for that already: your vote was added." : "Sent! Thanks."; load(); }
  catch (err) { $("#msg").textContent = err.message; } finally { $("#send").disabled = false; } };
load(); setInterval(load, 10000);
</script>
</body>
</html>
