<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b" id="theme-color">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Music-reactive lighting for WLED: beats, build-ups, drops and mood.">
<title>Tempolight</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempolight">
<script>try { var t = localStorage.getItem("tl.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..600&family=Google+Sans+Flex:wght@400..700&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/v2/ui.css">
</head>
<body>
<div class="demo-bar" id="demo-bar" hidden>Online demo with pretend WLED lights, running in your browser. <a href="https://github.com/D4RKGEEK/tempolight#install" target="_blank" rel="noopener">Install Tempolight</a> to drive real lights. <a href="/docs/">Docs</a></div>
<div class="shell v2shell">
  <nav class="rail" id="side" aria-label="Main">
    <a class="rail-brand" href="#/stage" title="Tempolight"><span class="lamp" id="lamp"></span><span class="rail-name">Tempolight</span></a>
    <div class="rail-nav" id="nav"></div>
    <div class="rail-host" title="Where Tempolight runs"><span class="dot" id="conn-dot"></span><b id="host-name"></b><span class="mono" id="host-addr"></span><small class="mono" id="ver"></small></div>
  </nav>
  <div class="main">
    <header class="top">
      <a class="iconbtn back" id="back" href="#/more" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 class="title" id="title">Stage</h1>
      <a class="hchip" id="hchip" href="#/songs/hear" data-state="idle" aria-label="How Tempolight hears music"><i aria-hidden="true"></i><span id="hchip-t">Not listening</span></a>
      <div class="master"><span>Lights</span><button class="switch" id="power" role="switch" aria-checked="true" aria-label="Lights on or off" type="button"></button></div>
      <div class="bright"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><input type="range" id="bri" min="0" max="100" aria-label="Brightness"><output id="bri-out" class="mono"></output></div>
      <button class="iconbtn" id="theme" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <main class="content" id="page" tabindex="-1"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<!-- the live status, for scripts and screen readers (v1's status bar; Stage shows it now) -->
<div class="sr-status" id="statusbar" aria-hidden="true"><b id="conn">Connecting…</b><b id="sb-source">–</b><b id="sb-effect">–</b><b id="sb-bpm">–</b><b id="sb-fps">–</b><b id="sb-leds">–</b></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
